name: Daily scrape & migrate

on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: biwengerbot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    env:
      BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      HEADLESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Keep this simple to avoid cached, mismatched wheels
      - name: Install Python deps (pin numpy/pandas + playwright)
        env:
          PIP_NO_CACHE_DIR: "1"     # avoid stale wheels
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # ✅ Compatible combo
          pip install "numpy==1.26.4"
          pip install "pandas==2.2.2"
          pip install "playwright==1.52.0"
          # Install the rest without re-resolving numpy/pandas/playwright
          pip install -r requirements.txt --no-deps || true
      # Install Chromium and its Linux dependencies
      - name: Install Playwright browsers + OS deps
        run: |
          python -m playwright install --with-deps chromium
      - name: Run scraper
        run: |
          python scraper/scraper.py

      - name: Run migration
        run: |
          python migration.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biwengerbot-output
          path: |
            league_standings.csv
            market_players.csv
            market_players_.csv
            players.csv
            players_.csv
            player_probabilities.csv
            scraper/team_*.csv
            data/biwenger_data.db
          if-no-files-found: warn
          retention-days: 30
