# .github/workflows/scrape-and-migrate.yml
name: Daily scrape & migrate

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: biwengerbot-daily
  cancel-in-progress: false

jobs:
  run:
    # Pin to 22.04 where Playwright deps are rock solid
    runs-on: ubuntu-22.04
    env:
      BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      HEADLESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ This action installs all Linux system libraries Playwright needs
      - name: Install Playwright system deps
        uses: microsoft/playwright-github-action@v1

      # Install the browser for Python Playwright
      - name: Install Chromium for Playwright
        run: |
          python -m playwright install chromium

      - name: Run scraper
        run: |
          python scraper/scraper.py

      - name: Run migration
        run: |
          python migration.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biwengerbot-output
          path: |
            league_standings.csv
            market_players.csv
            market_players_.csv
            players.csv
            players_.csv
            player_probabilities.csv
            scraper/team_*.csv
            data/biwenger_data.db
          if-no-files-found: warn
          retention-days: 30
