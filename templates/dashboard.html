<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biwenger Dashboard</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark">⚽</span>
                <span class="brand-title">Biwenger Dashboard</span>
                <span class="brand-sub">League analytics</span>
            </div>
        </div>
    </header>

    <main class="page">
        <div id="errorBanner" class="error-banner" style="display:none;"></div>

        <section class="grid single">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><span class="icon">🏆</span> League standings</span>
                    <span class="card-meta" id="currentDate"></span>
                </div>
                <div class="card-body scroll">
                    <table id="standingsTable">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Team</th>
                                <th class="num">Points</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="grid single">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><span class="icon">💰</span> Team valuations</span>
                    <span class="card-meta">Click a team to see its roster</span>
                </div>
                <div class="card-body">
                    <table id="teamsTable">
                        <thead>
                            <tr>
                                <th>Team</th>
                                <th class="num">Players</th>
                                <th class="num">GK</th>
                                <th class="num">DEF</th>
                                <th class="num">MID</th>
                                <th class="num">FWD</th>
                                <th class="num">Total value</th>
                                <th class="num">Value Δ</th>
                                <th class="num">Balance</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section class="grid single">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><span class="icon">🛒</span> Market — top listings</span>
                </div>
                <div class="card-body scroll">
                    <table id="marketTable">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Club</th>
                                <th>Name</th>
                                <th class="num">Price</th>
                                <th class="num">Change</th>
                                <th>Status</th>
                                <th class="num">Points</th>
                                <th class="num">Form</th>
                                <th class="num">Last szn</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script>
        window.__availableDates = {{ available_dates|tojson|safe }};
        window.__selectedDate = {{ selected_date|tojson|safe }};
    </script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
