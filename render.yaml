services:
  - type: web
    name: biwenger-dashboard
    runtime: python
    plan: free
    buildCommand: |
      apt-get update && apt-get install -y python3-distutils
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
