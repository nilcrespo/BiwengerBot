services:
  - type: web
    name: biwenger-dashboard
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install "numpy==1.26.4"
      pip install -r requirements.txt --no-deps
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
