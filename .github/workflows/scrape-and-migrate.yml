name: Daily scrape & migrate

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
concurrency:
  group: biwengerbot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-22.04
    env:
      BIWENGER_EMAIL: ${{ secrets.BIWENGER_EMAIL }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      HEADLESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Keep this simple to avoid cached, mismatched wheels
      - name: Install Python deps (pin numpy/pandas + playwright)
        env:
          PIP_NO_CACHE_DIR: "1"     # avoid stale wheels
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Compatible combo
          pip install "numpy==1.26.4"
          pip install "lxml==5.2.2"
          pip install "beautifulsoup4==4.12.3"
          pip install "pandas==2.2.2"
          pip install "playwright==1.52.0"
          pip install "matplotlib"
          # Install the rest without re-resolving numpy/pandas/playwright
          pip install -r requirements.txt --no-deps || true

      # Install Chromium and its Linux dependencies
      - name: Install Playwright browsers + OS deps
        run: |
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: |
          python scraper/scraper.py

      - name: Run migration
        run: |
          python migration.py

      - name: Send Telegram digest
        # Buy/sell recommendations, pending offers, and the renewal
        # outcome. No-ops cleanly (prints a warning, exits 0) if the
        # Telegram secrets below aren't set yet — continue-on-error is
        # still set as a second guard so a Telegram outage can never
        # block today's data from being committed.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python notify.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: biwengerbot-output
          path: |
            csvs/others/league_standings.csv
            csvs/market/market_players.csv
            csvs/others/players.csv
            csvs/others/player_probabilities.csv
            csvs/teams/team_*.csv
            data/biwenger_data.db
          if-no-files-found: warn
          retention-days: 30

      - name: Export static site
        # /api/data is just a once-daily SQLite query — freeze today's
        # snapshot to docs/ instead of paying for an always-on host to
        # serve it live. Deployed by the deploy-pages job below.
        run: |
          python export_static.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Update repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit files. unique_posts.json is the forum-post
          # scrape checkpoint (get_all_posts() reads it back in on the
          # next run to fetch only what's new) — it was missing from
          # this list, so any run where new posts actually showed up
          # left it as an uncommitted change that blocked the rebase
          # below with "cannot rebase: you have unstaged changes",
          # losing that whole run's data (the commit never got pushed).
          git add csvs/others/league_standings.csv || true
          git add csvs/market/market_players.csv || true
          git add csvs/others/player_probabilities.csv || true
          git add csvs/teams/team_*.csv 2>/dev/null || true
          git add data/biwenger_data.db || true
          git add unique_posts.json || true

          git commit -m "data: update CSV/DB from run ${GITHUB_RUN_NUMBER}" || echo "No changes"

          # These files are entirely regenerated by the scraper/migration
          # steps above, so there's nothing to actually merge between two
          # runs' versions of them — the newest run should just win
          # outright. A stash-based dance here previously left an
          # unresolved conflict (silently swallowed by `|| true`)
          # committed straight into league_standings.csv, with literal
          # <<<<<<< markers still in it — breaking every downstream
          # is_me lookup until caught by hand. Committing first (nothing
          # left to stash) and rebasing with -X ours (any conflict on
          # these data files resolves to what this run just produced)
          # avoids that failure mode outright, and this step no longer
          # swallows a real failure.
          git fetch origin main
          git rebase origin/main -X ours
          git push

  deploy-pages:
    needs: run
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
